<!doctype html>
<html lang="en-GB">
<head>

  <meta name="description" content="Build muscle with a plan that follows your tape measure: frame-based targets, training built around the exercises you already do, how-to animations for every exercise, and meals that fit your food rules, health and the food you have.">

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>

<body>
  <div id="app">
    <main id="view" class="view">
