<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found – Gainloop</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15191d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <style>
    /* Shown for any address that isn't part of the app, at any depth, so every link here starts with / */
    @font-face { font-family: 'Barlow'; src: url('/fonts/barlow-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Barlow'; src: url('/fonts/barlow-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Barlow Condensed'; src: url('/fonts/barlow-condensed-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    :root {
      --bg: #f3f3ef;
      --ink: #1c232b;
      --ink-2: #4a5561;
      --tape: #f2c230;
      --tape-ink: #1c232b;
      --tape-edge: rgba(28, 35, 43, 0.14);
      --btn-bg: #1c232b;
      --btn-fg: #f8f8f5;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15191d;
        --ink: #eceee9;
        --ink-2: #b6bdc5;
        --tape-edge: rgba(0, 0, 0, 0.25);
        --btn-bg: #eceee9;
        --btn-fg: #15191d;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 17px/1.45 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 12vh) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
    }
    /* A strip of tape measure: long marks every 40px, short ones every 8px */
    .tape {
      height: 30px;
      border-radius: 4px;
      background-color: var(--tape);
      background-image:
        repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(90deg, var(--tape-ink) 0 1px, transparent 1px 8px);
      background-size: 100% 14px, 100% 7px;
      background-position: 12px 0, 12px 0;
      background-repeat: no-repeat;
      box-shadow: inset 0 0 0 1px var(--tape-edge);
    }
    h1 {
      font: 700 44px/0.95 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
      letter-spacing: -0.005em;
      margin: 24px 0 12px;
      text-wrap: balance;
    }
    p { color: var(--ink-2); font-size: 19px; line-height: 1.4; max-width: 34ch; margin: 0 0 26px; }
    .btn {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      font: 600 16px/1.1 'Barlow', system-ui, sans-serif;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.92; }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="tape" aria-hidden="true"></div>
    <h1>Page not found</h1>
    <p>This address isn’t part of Gainloop. The link may be old or mistyped. Your plan and progress are still saved in the app.</p>
    <a class="btn" href="/">Open Gainloop</a>
  </main>
</body>
</html>
